<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – La Grada</title>
  <link rel="icon" type="image/jpeg" href="https://res.cloudinary.com/dfwgsepcm/image/upload/v1781915834/logo_ocwskx.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --gold: #c9a84c; --gold-light: #e8c97a; --black: #000; --white: #f5f2ec; }
    body { background: var(--black); color: var(--white); font-family: 'Barlow', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    body::before { content: ''; position: fixed; inset: 0; background-image: url('https://res.cloudinary.com/dfwgsepcm/image/upload/v1781915834/hero_d8s5f3.jpg'); background-size: cover; background-position: center; z-index: 0; }
    body::after { content: ''; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 0; }

    .login-box { position: relative; z-index: 1; width: 100%; max-width: 360px; padding: 0 1rem; }
    .login-logo { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; letter-spacing: 0.15em; text-align: center; margin-bottom: 0.3rem; }
    .login-logo span { color: var(--gold); }
    .login-badge { text-align: center; font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(245,242,236,0.35); margin-bottom: 2rem; }
    .login-card { background: rgba(10,10,10,0.9); backdrop-filter: blur(10px); padding: 2rem; border: 1px solid rgba(201,168,76,0.15); }
    .login-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 0.1em; margin-bottom: 1.5rem; color: var(--gold); }
    .form-group { margin-bottom: 1rem; }
    .form-label { font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(245,242,236,0.4); display: block; margin-bottom: 0.4rem; }
    .form-input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(201,168,76,0.2); color: var(--white); font-family: 'Barlow', sans-serif; font-size: 0.9rem; padding: 0.7rem 0.9rem; outline: none; transition: border-color 0.2s; }
    .form-input:focus { border-color: var(--gold); }
    .login-btn { width: 100%; padding: 0.85rem; background: var(--gold); color: var(--black); font-size: 0.8rem; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 600; border: none; cursor: pointer; margin-top: 0.5rem; transition: background 0.2s; }
    .login-btn:hover { background: var(--gold-light); }
    .error-msg { background: rgba(139,0,0,0.3); border: 1px solid rgba(139,0,0,0.5); color: #e07070; font-size: 0.75rem; padding: 0.6rem 0.8rem; margin-bottom: 1rem; display: {% if error %}block{% else %}none{% endif %}; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-logo">LA <span>GRADA</span></div>
    <div class="login-badge">Panel de administración</div>
    <div class="login-card">
      <div class="login-title">INICIAR SESIÓN</div>
      <div class="error-msg">{% if error %}{{ error }}{% endif %}</div>
      <form method="POST" action="/admin/login">
        <div class="form-group">
          <label class="form-label">Usuario</label>
          <input class="form-input" type="text" name="username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label class="form-label">Contraseña</label>
          <input class="form-input" type="password" name="password" autocomplete="current-password" required>
        </div>
        <button class="login-btn" type="submit">Entrar</button>
      </form>
    </div>
  </div>
</body>
</html>
