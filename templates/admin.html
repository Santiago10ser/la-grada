<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – La Grada</title>
  <link rel="icon" type="image/jpeg" href="/static/img/logo.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --gold: #c9a84c; --gold-light: #e8c97a; --black: #000; --dark: #0a0a0a; --mid: #111; --white: #f5f2ec; }
    body { background: var(--dark); color: var(--white); font-family: 'Barlow', sans-serif; min-height: 100vh; }

    /* NAV */
    nav { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: var(--black); border-bottom: 1px solid rgba(201,168,76,0.2); }
    .nav-logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; letter-spacing: 0.15em; color: var(--white); }
    .nav-logo span { color: var(--gold); }
    .nav-badge { font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; background: rgba(201,168,76,0.15); color: var(--gold); padding: 3px 10px; border: 1px solid rgba(201,168,76,0.3); }
    .nav-right { display: flex; align-items: center; gap: 1rem; }
    .nav-link { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(245,242,236,0.5); text-decoration: none; transition: color 0.2s; }
    .nav-link:hover { color: var(--gold); }
    .logout-btn { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; background: transparent; border: 1px solid rgba(201,168,76,0.3); color: rgba(245,242,236,0.5); padding: 0.4rem 1rem; cursor: pointer; transition: all 0.2s; }
    .logout-btn:hover { border-color: var(--gold); color: var(--gold); }

    /* LAYOUT */
    .admin-layout { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 57px); }

    /* SIDEBAR */
    .sidebar { background: var(--black); border-right: 1px solid rgba(201,168,76,0.1); padding: 1.5rem 0; }
    .sidebar-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 1.5rem; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(245,242,236,0.4); cursor: pointer; transition: all 0.2s; border-left: 2px solid transparent; }
    .sidebar-item:hover { color: var(--white); background: rgba(255,255,255,0.03); }
    .sidebar-item.active { color: var(--gold); border-left-color: var(--gold); background: rgba(201,168,76,0.05); }
    .sidebar-icon { font-size: 1rem; }

    /* MAIN */
    .admin-main { padding: 2rem; }
    .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 0.08em; margin-bottom: 0.3rem; }
    .page-title span { color: var(--gold); }
    .page-subtitle { font-size: 0.72rem; color: rgba(245,242,236,0.35); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 2rem; }

    /* STATS */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: rgba(201,168,76,0.08); margin-bottom: 2rem; }
    .stat { background: var(--mid); padding: 1.2rem 1.5rem; }
    .stat-label { font-size: 0.62rem; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(245,242,236,0.3); margin-bottom: 0.4rem; }
    .stat-value { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--gold); letter-spacing: 0.05em; }

    /* TOOLBAR */
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.75rem; }
    .toolbar-left { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .filter-tab { font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.45rem 1rem; border: 1px solid rgba(201,168,76,0.2); background: transparent; color: rgba(245,242,236,0.45); cursor: pointer; transition: all 0.2s; }
    .filter-tab:hover { border-color: var(--gold); color: var(--gold); }
    .filter-tab.active { background: var(--gold); color: var(--black); border-color: var(--gold); font-weight: 600; }
    .add-btn { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 0.5rem 1.2rem; background: var(--gold); color: var(--black); border: none; cursor: pointer; font-weight: 600; transition: background 0.2s; }
    .add-btn:hover { background: var(--gold-light); }

    /* TABLE */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th { font-size: 0.62rem; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(245,242,236,0.3); padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid rgba(201,168,76,0.1); white-space: nowrap; }
    td { padding: 0.75rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 0.82rem; vertical-align: middle; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .product-img-thumb { width: 44px; height: 56px; object-fit: cover; border-radius: 2px; }
    .tag-badge { font-size: 0.58rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 7px; font-weight: 600; }
    .tag-new { background: var(--gold); color: var(--black); }
    .tag-sale { background: #8b0000; color: var(--white); }
    .tag-none { color: rgba(245,242,236,0.25); font-size: 0.75rem; }
    .action-btn { font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.35rem 0.8rem; border: none; cursor: pointer; transition: all 0.2s; font-weight: 600; }
    .edit-btn { background: rgba(201,168,76,0.15); color: var(--gold); margin-right: 4px; }
    .edit-btn:hover { background: var(--gold); color: var(--black); }
    .delete-btn { background: rgba(139,0,0,0.2); color: #e07070; }
    .delete-btn:hover { background: #8b0000; color: var(--white); }

    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: none; align-items: center; justify-content: center; padding: 1rem; }
    .modal-overlay.open { display: flex; }
    .modal { background: #111; border: 1px solid rgba(201,168,76,0.2); width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 1.5rem; border-bottom: 1px solid rgba(201,168,76,0.1); }
    .modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 0.08em; }
    .modal-close { background: transparent; border: none; color: rgba(245,242,236,0.4); font-size: 1.2rem; cursor: pointer; }
    .modal-close:hover { color: var(--white); }
    .modal-body { padding: 1.5rem; }
    .form-group { margin-bottom: 1rem; }
    .form-label { font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(245,242,236,0.4); display: block; margin-bottom: 0.4rem; }
    .form-input, .form-select { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(201,168,76,0.2); color: var(--white); font-family: 'Barlow', sans-serif; font-size: 0.88rem; padding: 0.65rem 0.8rem; outline: none; transition: border-color 0.2s; }
    .form-input:focus, .form-select:focus { border-color: var(--gold); }
    .form-select option { background: #111; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .modal-footer { display: flex; gap: 0.5rem; justify-content: flex-end; padding: 1rem 1.5rem; border-top: 1px solid rgba(201,168,76,0.1); }
    .btn-cancel { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.6rem 1.2rem; background: transparent; border: 1px solid rgba(255,255,255,0.15); color: rgba(245,242,236,0.5); cursor: pointer; }
    .btn-save { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.6rem 1.5rem; background: var(--gold); color: var(--black); border: none; cursor: pointer; font-weight: 600; }
    .btn-save:hover { background: var(--gold-light); }

    /* IMG PREVIEW */
    .img-preview { width: 100%; height: 120px; object-fit: cover; margin-top: 0.5rem; border: 1px solid rgba(201,168,76,0.15); display: none; }
    .img-preview.visible { display: block; }

    /* TOAST */
    .toast { position: fixed; bottom: 2rem; right: 2rem; background: var(--gold); color: var(--black); font-size: 0.8rem; font-weight: 600; letter-spacing: 0.08em; padding: 0.8rem 1.5rem; z-index: 300; transform: translateY(100px); opacity: 0; transition: all 0.3s; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.error { background: #8b0000; color: var(--white); }

    /* EMPTY */
    .empty { padding: 4rem; text-align: center; color: rgba(245,242,236,0.25); }
    .empty-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; letter-spacing: 0.1em; margin-bottom: 0.5rem; }
  </style>
</head>
<body>

  <nav>
    <div style="display:flex; align-items:center; gap:1rem;">
      <div class="nav-logo">LA <span>GRADA</span></div>
      <span class="nav-badge">Admin</span>
    </div>
    <div class="nav-right">
      <a href="/" class="nav-link" target="_blank">Ver tienda →</a>
      <button class="logout-btn" onclick="logout()">Cerrar sesión</button>
    </div>
  </nav>

  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-item active" onclick="showSection('productos')">
        <span class="sidebar-icon">👕</span> Productos
      </div>
    </aside>

    <main class="admin-main">
      <div class="page-title">PANEL <span>ADMIN</span></div>
      <div class="page-subtitle">Gestión de productos — La Grada</div>

      <div class="stats" id="statsBar">
        <div class="stat"><div class="stat-label">Total productos</div><div class="stat-value" id="statTotal">—</div></div>
        <div class="stat"><div class="stat-label">Selecciones</div><div class="stat-value" id="statSel">—</div></div>
        <div class="stat"><div class="stat-label">Paraguay</div><div class="stat-value" id="statPy">—</div></div>
      </div>

      <div class="toolbar">
        <div class="toolbar-left">
          <button class="filter-tab active" onclick="filterProducts('Todos', this)">Todos</button>
          <button class="filter-tab" onclick="filterProducts('Selecciones', this)">Selecciones</button>
          <button class="filter-tab" onclick="filterProducts('Paraguay', this)">Paraguay</button>
        </div>
        <button class="add-btn" onclick="openModal()">+ Agregar producto</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>⠿</th>
              <th>Foto</th>
              <th>Nombre</th>
              <th>Categoría</th>
              <th>Precio</th>
              <th>Versión</th>
              <th>Talles</th>
              <th>Tag</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="productTable">
            <tr><td colspan="8" style="text-align:center; padding:2rem; color:rgba(245,242,236,0.3);">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">AGREGAR PRODUCTO</div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editId">
        <div class="form-group">
          <label class="form-label">Nombre *</label>
          <input class="form-input" id="fName" type="text" placeholder="Ej: Francia 25/26 Local">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Categoría *</label>
            <select class="form-select" id="fCategory">
              <option value="Selecciones">Selecciones</option>
              <option value="Paraguay">Paraguay</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Versión *</label>
            <select class="form-select" id="fVersion">
              <option value="Jugador">Jugador</option>
              <option value="Fan">Fan</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Precio (Gs.) *</label>
            <input class="form-input" id="fPrice" type="number" placeholder="250000">
          </div>
          <div class="form-group">
            <label class="form-label">Tag</label>
            <select class="form-select" id="fTag">
              <option value="">Sin tag</option>
              <option value="new">Nuevo</option>
              <option value="sale">Oferta</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Talles</label>
            <input class="form-input" id="fTallas" type="text" placeholder="M, L, XL">
          </div>
          <div class="form-group">
            <label class="form-label">Color (hex)</label>
            <input class="form-input" id="fColor" type="text" placeholder="#002395">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">URL de la imagen *</label>
          <input class="form-input" id="fImg" type="text" placeholder="https://res.cloudinary.com/..." oninput="previewImg()">
          <img class="img-preview" id="imgPreview" src="" alt="Preview">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
        <button class="btn-save" onclick="saveProduct()">Guardar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let allProducts = [];
    let currentFilter = 'Todos';

    // ── FETCH ──────────────────────────────────────────
    async function loadProducts() {
      try {
        const res = await fetch('/admin/api/productos');
        allProducts = await res.json();
        updateStats();
        renderTable(allProducts);
      } catch(e) {
        showToast('Error al cargar productos', true);
      }
    }

    function updateStats() {
      document.getElementById('statTotal').textContent = allProducts.length;
      document.getElementById('statSel').textContent = allProducts.filter(p => p.category === 'Selecciones').length;
      document.getElementById('statPy').textContent = allProducts.filter(p => p.category === 'Paraguay').length;
    }

    function filterProducts(cat, btn) {
      currentFilter = cat;
      document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const filtered = cat === 'Todos' ? allProducts : allProducts.filter(p => p.category === cat);
      renderTable(filtered);
    }

    function renderTable(products) {
      const tbody = document.getElementById('productTable');
      if (!products.length) {
        tbody.innerHTML = '<tr><td colspan="9"><div class="empty"><div class="empty-title">Sin productos</div><p>Agregá uno con el botón de arriba.</p></div></td></tr>';
        return;
      }
      // Sort by orden
      products.sort((a, b) => (a.orden || 0) - (b.orden || 0));
      tbody.innerHTML = products.map(p => `
        <tr draggable="true" data-id="${p.id}" data-orden="${p.orden || 0}" ondragstart="dragStart(event)" ondragover="dragOver(event)" ondrop="dropRow(event)">
          <td style="cursor:grab; color:rgba(245,242,236,0.2); font-size:1.2rem; user-select:none;">⠿</td>
          <td><img class="product-img-thumb" src="${p.img || ''}" alt="${p.name}" onerror="this.style.opacity='0.2'"></td>
          <td><strong>${p.name}</strong></td>
          <td style="color:rgba(245,242,236,0.5); font-size:0.75rem;">${p.category}</td>
          <td style="color:var(--gold); font-weight:600;">Gs. ${parseInt(p.price).toLocaleString('es-PY')}</td>
          <td style="font-size:0.75rem;">${p.version || '—'}</td>
          <td style="font-size:0.75rem; color:rgba(245,242,236,0.5);">${p.tallas || '—'}</td>
          <td>${p.tag ? `<span class="tag-badge tag-${p.tag}">${p.tag === 'new' ? 'Nuevo' : 'Oferta'}</span>` : '<span class="tag-none">—</span>'}</td>
          <td>
            <button class="action-btn edit-btn" onclick="editProduct(${p.id})">Editar</button>
            <button class="action-btn delete-btn" onclick="deleteProduct(${p.id}, '${p.name.replace(/'/g, "\\'")}')">Borrar</button>
          </td>
        </tr>
      `).join('');
    }

    // ── MODAL ──────────────────────────────────────────
    function openModal(product = null) {
      document.getElementById('editId').value = product ? product.id : '';
      document.getElementById('modalTitle').textContent = product ? 'EDITAR PRODUCTO' : 'AGREGAR PRODUCTO';
      document.getElementById('fName').value = product?.name || '';
      document.getElementById('fCategory').value = product?.category || 'Selecciones';
      document.getElementById('fVersion').value = product?.version || 'Jugador';
      document.getElementById('fPrice').value = product?.price || '';
      document.getElementById('fTag').value = product?.tag || '';
      document.getElementById('fTallas').value = product?.tallas || 'M, L, XL';
      document.getElementById('fColor').value = product?.color || '';
      document.getElementById('fImg').value = product?.img || '';
      const preview = document.getElementById('imgPreview');
      if (product?.img) { preview.src = product.img; preview.classList.add('visible'); }
      else { preview.classList.remove('visible'); }
      document.getElementById('modalOverlay').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
    }

    function editProduct(id) {
      const p = allProducts.find(p => p.id === id);
      if (p) openModal(p);
    }

    function previewImg() {
      const url = document.getElementById('fImg').value;
      const preview = document.getElementById('imgPreview');
      if (url) { preview.src = url; preview.classList.add('visible'); }
      else { preview.classList.remove('visible'); }
    }

    // ── SAVE ───────────────────────────────────────────
    async function saveProduct() {
      const id = document.getElementById('editId').value;
      const data = {
        name: document.getElementById('fName').value.trim(),
        category: document.getElementById('fCategory').value,
        version: document.getElementById('fVersion').value,
        price: parseInt(document.getElementById('fPrice').value),
        tag: document.getElementById('fTag').value || null,
        tallas: document.getElementById('fTallas').value.trim(),
        color: document.getElementById('fColor').value.trim(),
        img: document.getElementById('fImg').value.trim(),
      };

      if (!data.name || !data.price || !data.img) {
        showToast('Completá nombre, precio e imagen', true);
        return;
      }

      try {
        const url = id ? `/admin/api/productos/${id}` : '/admin/api/productos';
        const method = id ? 'PUT' : 'POST';
        const res = await fetch(url, { method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
        if (res.ok) {
          closeModal();
          await loadProducts();
          showToast(id ? 'Producto actualizado ✓' : 'Producto agregado ✓');
        } else {
          showToast('Error al guardar', true);
        }
      } catch(e) {
        showToast('Error de conexión', true);
      }
    }

    // ── DELETE ─────────────────────────────────────────
    async function deleteProduct(id, name) {
      if (!confirm(`¿Borrar "${name}"?`)) return;
      try {
        const res = await fetch(`/admin/api/productos/${id}`, { method: 'DELETE' });
        if (res.ok) {
          await loadProducts();
          showToast('Producto eliminado');
        } else {
          showToast('Error al eliminar', true);
        }
      } catch(e) {
        showToast('Error de conexión', true);
      }
    }

    // ── TOAST ──────────────────────────────────────────
    function showToast(msg, error = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast' + (error ? ' error' : '');
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    // ── LOGOUT ─────────────────────────────────────────
    function logout() {
      window.location.href = '/admin/logout';
    }

    // ── DRAG & DROP ────────────────────────────────────
    let dragSrcId = null;

    function dragStart(e) {
      dragSrcId = parseInt(e.currentTarget.dataset.id);
      e.currentTarget.style.opacity = '0.4';
      e.dataTransfer.effectAllowed = 'move';
    }

    function dragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      document.querySelectorAll('#productTable tr').forEach(r => r.style.borderTop = '');
      e.currentTarget.style.borderTop = '2px solid var(--gold)';
      return false;
    }

    async function dropRow(e) {
      e.preventDefault();
      document.querySelectorAll('#productTable tr').forEach(r => {
        r.style.borderTop = '';
        r.style.opacity = '1';
      });
      const dropId = parseInt(e.currentTarget.dataset.id);
      if (dragSrcId === dropId) return;

      // Reorder allProducts array
      const srcIdx = allProducts.findIndex(p => p.id === dragSrcId);
      const dstIdx = allProducts.findIndex(p => p.id === dropId);
      const [moved] = allProducts.splice(srcIdx, 1);
      allProducts.splice(dstIdx, 0, moved);

      // Assign new orden values
      const updates = allProducts.map((p, i) => ({ id: p.id, orden: i + 1 }));

      // Save to backend
      try {
        const res = await fetch('/admin/api/productos/reorder', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updates)
        });
        if (res.ok) {
          allProducts.forEach((p, i) => p.orden = i + 1);
          renderTable(allProducts);
          showToast('Orden guardado ✓');
        } else {
          showToast('Error al guardar orden', true);
        }
      } catch(e) {
        showToast('Error de conexión', true);
      }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
    loadProducts();
  </script>
</body>
</html>
